name: CI

on:
  pull_request:
  push:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # fmt + clippy + tests + versions + nu tests —
  # the same script `just check-all` runs.
  gate:
    name: quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: hustcer/setup-nu@v3
        with:
          version: "0.116.1"
      - name: Quality gate
        run: nu scripts/ci/quality_gate.nu

  # Users build on all three systems: paths and line endings differ there.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS arm64 hosted runners are often capacity-starved: don't hang or
    # fail the run on that. macos-check below still covers the target.
    timeout-minutes: 20
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        run: cargo test --workspace --all-features

  # No macOS runner needed: type-check + clippy against the Apple targets from
  # Linux. Catches cfg(target_os) / API breakage, not runtime behaviour.
  macos-check:
    name: macOS (cross-check ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: cargo clippy (${{ matrix.target }})
        run: cargo clippy --workspace --all-features --all-targets --target ${{ matrix.target }} --locked -- -D warnings

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # @master + toolchain, not @1.88: Dependabot would bump a version ref.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked
